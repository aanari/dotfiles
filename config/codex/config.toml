# Default Codex settings.

# High reasoning effort is the closest persistent match to an
# "always think" Claude Code setup.
model_instructions_file = "/Users/ali/.codex/AGENTS.md"
model = "gpt-5.6"
model_reasoning_effort = "xhigh"
approvals_reviewer = "user"
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Ring the bell + desktop notification on turn completion / pending approval.
notify = ["agent-notify", "Codex"]

[projects."/Users/ali/.dotfiles"]
trust_level = "trusted"

[projects."/Users/ali/Downloads/src"]
trust_level = "trusted"

[projects."/Users/ali/Projects/loa"]
trust_level = "trusted"

[projects."/Users/ali/Projects/openclaw"]
trust_level = "trusted"

[projects."/Users/ali/Projects/Claw"]
trust_level = "trusted"

[projects."/Users/ali/Documents/Mermaid"]
trust_level = "trusted"

[tui]
theme = "github"
# Minimal terminal title: just the task. The default is
# ["activity", "thread-name", "project-name"], whose `activity` item is a
# braille spinner that advances every 100ms while a turn runs -- ten title
# rewrites a second, which reads as flicker in a herdr sidebar or a tmux status
# line. The project name is redundant there too, since the Space or window
# already names it, and notifications carry the rest.
#
# thread-title over thread-name deliberately: thread-name is None until the
# thread is named, which clears the title and leaves a blank row, while
# thread-title falls back to the thread id so there is always something.
terminal_title = ["thread-title"]

[features]
memories = true

[skills]
config = [
  { path = "/Users/ali/.agents/skills/goal-definer", enabled = true },
]

# abliteration.ai (Dropbox/College). Codex only honors model_provider /
# model_providers at user level, so the provider lives here and the project
# selects it with `codex --profile abliteration` (project-local config cannot).
# The profile itself is a separate file: config/codex/abliteration.config.toml.
# base_url goes through the local image-trimming proxy
# (College/ablit-proxy.py); use https://api.abliteration.ai/v1 to skip it.
[model_providers.abliteration]
name = "abliteration.ai"
base_url = "http://127.0.0.1:8787/v1"
wire_api = "responses"
env_key = "ABLITERATION_API_KEY"
